# The models the app offers: its pickers in the browser, and ./sst models.list.
#
# To choose your own, copy this file to models.ini (gitignored) and edit that. Without a models.ini, the app
# reads this file. One Venice model id per line, under [text] or [image], in the order the pickers show them.
# "#" starts a comment: uncomment a line to offer that model, comment it out to hide it. An edit shows on the
# next models.list (reload the page); no restart needed.
#
# We have spot-checked these models, but we can't have checked them all. The enabled ones are the ones we lean
# on. The commented-out ones have been through the app and are known to work, with what we know beside each:
# uncomment them at your own risk. Prices, privacy and reasoning levels are in ./sst models.list (live from
# Venice), and ./sst models.list --all lists every model Venice has. T-numbers are tickets in TICKETS.md;
# docs/design.md, "Models", has the measurements.
#
# This list only decides what is offered. Any model Venice lists can still be set by id from the terminal
# (conversation.update --settings.text-model <id>, brain.update --text-model <id>), and a conversation already
# on a model that isn't listed here keeps it, shown by name.
#
# New conversations start on deepseek-v4-1-flash and z-image-turbo (src/config.ts): keep those two enabled.

[text]
deepseek-v4-1-flash                    # DeepSeek V4.1 Flash, the default. Proven live with everything the app sends: stop sequences, reasoning off, an image brain's forced tool call. The example campaign and the preset were tuned on it.
google-gemma-4-31b-it                  # Gemma 4 31B. Cheap; worked live as a second brain (a turn, a steered re-roll). Reasoning levels none/low/medium/high.

# Known to work, off by default:
# kimi-k3                              # Kimi K3. Offered since T11; no problems seen, nothing measured. Venice's own pick for reasoning; pricey.
# kimi-k2-6                            # Kimi K2.6. Offered since T11; no problems seen, nothing measured.
# kimi-k2-5                            # Kimi K2.5. Offered since T11; no problems seen, nothing measured.
# qwen-3-8-2-4t-a95b                   # Qwen 3.8 2.4T. Offered since T11; no problems seen, nothing measured. Reasons, with no effort levels.
# z-ai-glm-5-3                         # GLM 5.3. Always reasons: Venice refuses reasoning off, so give its brains reasoning on. Clean live that way; a long task can think for 10k+ tokens.
# minimax-m3-preview                   # MiniMax M3 Preview. Offered since T11; no problems seen, nothing measured.
# mistral-small-3-2-24b-instruct       # Mistral Small 3.2. As an image brain's text model it rambles before the image call, and once looped with no call at all (the app now cuts that off).
# nvidia-nemotron-3-ultra-550b-a55b    # Nemotron 3 Ultra. Offered since T11; no problems seen, nothing measured.
# xiaomi-mimo-v2-6-flash               # MiMo V2.6 Flash. Offered since T11; no problems seen, nothing measured.
# llama-3.3-70b                        # Llama 3.3 70B. No reasoning. Offered since T11; no problems seen, nothing measured.
# inkling                              # Inkling. Offered since T11; no problems seen, nothing measured.
# grok-4-7                             # Grok 4.7. Adds ~1,240 hidden prompt tokens to every request and reasons with reasoning off: it breaks "every word sent is visible". Kept out on purpose.

[image]
z-image-turbo                          # Z-Image Turbo, the default. $0.01 an image, ~3 s; Venice's own default and its fastest. Painted live since T05.
hunyuan-image-v3                       # Hunyuan Image 3.0 (Tencent, open weights). The expensive one: $0.09 an image, sized by aspect ratio. Sized and priced right on the mock; not yet painted live in a ticket pass.

# Known to work, off by default:
# grok-imagine-image-2-0               # Grok Imagine 2.0. $0.05-$0.10 an image by quality and resolution (1K/2K). Sized and priced right on the mock.


# =====================================================================================================
# Uncensored: off by default, enable at your own risk.
# Venice marks these models uncensored: they will write or paint what the aligned ones refuse.
# =====================================================================================================

[text]
# gemma-4-uncensored                   # Gemma 4 Uncensored. No reasoning. Offered since T11; nothing measured.
# qwen-3-8-27b                         # Qwen 3.8 27B (beta at Venice). Offered since T11; nothing measured.
# venice-uncensored-1-2                # Venice Uncensored 1.2. No reasoning. Adds its own ~550-token prompt to a request with no system message; the app always sends one, so it never does here.
# venice-uncensored-role-play          # Venice Role Play Uncensored. No reasoning. Offered since T11; nothing measured.
# abliteration-abliterated-model-large-v2   # Abliterated Large V2, GLM 5.3's uncensored twin. Anonymized, not private: Venice proxies it to Abliteration AI. Reasons even with reasoning off.
# olafangensan-glm-4.7-flash-heretic   # GLM 4.7 Flash Heretic. Offered until T15, then parked with GLM 5.3 and not brought back.

[image]
# chroma                               # Chroma. $0.01 an image, sized by width x height. Offered since T11; nothing measured.
# krea-2-turbo                         # Krea 2 Turbo. $0.04-$0.06 an image (1K/2K), sized by aspect ratio; used through the app on the mock.
# wai-Illustrious                      # Anime (WAI). $0.01 an image, anime style. Offered since T11; nothing measured.
